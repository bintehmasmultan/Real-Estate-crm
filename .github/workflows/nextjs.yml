# CI build check for the Next.js app (Firebase Auth + Firestore).
# This app is not a static GitHub Pages site — do not upload ./out.
name: Build Next.js app

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "nextjs-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Next.js
        env:
          # Placeholders for compile-time env; runtime uses Vercel/local secrets.
          NEXT_PUBLIC_FIREBASE_API_KEY: build-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: estate-crm-web.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: estate-crm-web
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: estate-crm-web.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "687650644413"
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
        run: npx next build
